name: token-usage-plugin-claude
services:
  dev:
    build:
      context: .
    container_name: token-usage-plugin-claude-dev
    hostname: dev
    volumes:
      - ..:/workspaces/token-usage-plugin-claude
      - ~/.claude:/home/vscode/.claude
      - ~/.claude.json:/tmp/host-claude.json:ro
    environment:
      - NODE_ENV=development
    command: sleep infinity
    restart: unless-stopped
